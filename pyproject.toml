[project]
name = "albanna"
authors = [
    { name = "Albanna Software Solutions", email = "admin@albanna.dev"}
]
description = "ERPNext side chat — ask about your data in plain language"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: Frappe",
]
# The licence is the SPDX expression above.  The `License :: OSI Approved
# :: MIT License` classifier used to say the same thing, and flit refuses
# to build a package that says it twice: the classifier is deprecated
# (PEP 639), and the build failed on every modern flit.
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # `frappe` is installed and managed by the bench, and is deliberately
    # not listed here: it is not on PyPI, and the bench provides it.
    #
    # The ERPNext tools are implemented in this app (albanna/tools/erpnext.py)
    # rather than pulled from a package, so the app installs anywhere.
    #
    # LLM provider transport.
    "requests>=2.31.0",
    # JSON Schema validation of tool arguments, before a call reaches Frappe.
    "jsonschema>=4.0.0",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=5.0", "ruff>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q -m 'not integration'"
markers = [
    "integration: needs a live bench site (opt-in; run with `bench --site test.localhost run-tests --app albanna`)",
]

[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "C901",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
]
typing-modules = ["frappe.types.DF"]

# The complexity bar is explicit, and it sits at the worst function the
# app has: `_run_tool` and `bulk_update_doc`, both 15.  Ruff's default of
# 10 was never a decision of this app's — it was a default — and it fires
# on functions that were written on purpose, so it made the gate noisy
# rather than strict.  A new function has to be worse than the worst one
# that exists to be refused.
[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# Frappe generates doctype controllers with tab indentation.
"albanna/albanna/doctype/**/*.py" = ["W191"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
