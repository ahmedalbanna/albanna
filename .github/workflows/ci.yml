name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linters:
    name: Linters and the front-end suites
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The tools are pinned, and they are the versions the code was
          # written and tested against.  An unpinned gate is a gate that
          # changes its mind when a new release lands.
          pip install ruff==0.16.1 requests==2.34.2 jsonschema==4.26.0

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Translation catalogue
        # The Arabic catalogue must cover every string the app uses; a
        # missing entry is a silent English fallback for Arabic readers.
        run: python scripts/check_translations.py

      - name: The front-end suites
        # Every suite, each file on its own — the rule is that a suite
        # fails alone, so the file that failed is the file that says
        # why.  A new suite is picked up by this loop without anyone
        # having to remember to list it here.
        run: |
          for suite in albanna/public/js/side-chat/*.test.mjs; do
            node "$suite"
          done

  server:
    name: Server tests
    runs-on: ubuntu-latest
    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # Frappe v16 asks for Python 3.14; the bench's own venv is
          # created with this interpreter, so the framework and the
          # tests run on the same one.
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client
          # The MariaDB container serves no TLS, and Ubuntu's client asks
          # for it by default — so every connection fails with "SSL is
          # required, but the server does not support it", including the
          # ones the framework makes itself when it creates the site's
          # database.  The client is told the truth about this container
          # instead.
          sudo tee /etc/mysql/mariadb.conf.d/99-no-ssl.cnf >/dev/null <<'EOF'
          [client]
          skip-ssl
          EOF

      - name: Setup the bench
        run: |
          pip install frappe-bench==5.29.0
          # The framework is pinned to a tag, not to a branch: a tag does
          # not move, so the gate tests the same framework tomorrow as it
          # tests today.  v16 is the line this app is written against.
          bench init --frappe-branch v16.0.0 --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench
          # `--skip-ssl`: the MariaDB container serves no TLS, and the
          # client asks for it by default — so the connection fails with
          # "SSL is required, but the server does not support it" before
          # a single statement runs.
          mariadb --host 127.0.0.1 --port 3306 -u root -proot --skip-ssl -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot --skip-ssl -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app --branch v16.0.0 erpnext
          bench get-app $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench pip install pytest==9.1.1
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app erpnext
          bench --site test_site install-app albanna
        env:
          CI: "Yes"

      - name: Give the site some data
        working-directory: /home/runner/frappe-bench
        # The site suite writes a document and reads it back, so the site
        # needs a company, a customer and an item.  ERPNext's own demo
        # setup is the honest way to get them: it uses the framework's
        # paths, so it cannot drift from the data the tests expect.
        #
        # It needs a company to clone, and a site that has just had
        # ERPNext installed has none — so the company comes first, made
        # by ERPNext's own setup-wizard operation, with the fiscal year
        # the demo's transactions are posted in.
        run: |
          YEAR=$(date +%Y)
          bench --site test_site execute erpnext.setup.setup_wizard.operations.company_setup.create_fiscal_year_and_company \
            --kwargs "{\"company_name\": \"Albanna Test Company\", \"company_abbr\": \"ATC\", \"currency\": \"USD\", \"country\": \"United States\", \"fy_start_date\": \"$YEAR-01-01\", \"fy_end_date\": \"$YEAR-12-31\"}"
          bench --site test_site execute erpnext.setup.demo.setup_demo_data
          bench --site test_site set-config allow_tests true
          bench build
        env:
          CI: "Yes"

      - name: The domain suite
        # The domain suite needs no site, but five of its modules import
        # the framework — so it runs here, in the bench's own virtualenv,
        # which is the same command a developer runs: `../../env/bin/python
        # -m pytest`.
        working-directory: /home/runner/frappe-bench/apps/albanna
        run: ../env/bin/python -m pytest

      - name: Run the server tests
        working-directory: /home/runner/frappe-bench
        run: bench --site test_site run-tests --app albanna
        env:
          TYPE: server
