name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linters:
    name: Linters and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest requests jsonschema

      - name: Ruff
        run: ruff check .

      - name: The domain suite
        # No bench, no site, no network: the domain is pure, and these are
        # the tests that must stay fast.
        run: pytest -q

      - name: The markdown renderer
        run: node albanna/public/js/side-chat/markdown.test.mjs

      - name: The turn transport
        run: node albanna/public/js/side-chat/turn.test.mjs

      - name: The turn's state machine
        run: node albanna/public/js/side-chat/state.test.mjs

      - name: The Desk's route event
        run: node albanna/public/js/side-chat/page.test.mjs

      - name: What the widget thinks the page is
        run: node albanna/public/js/side-chat/context.test.mjs

      - name: The questions the reader has asked
        run: node albanna/public/js/side-chat/recent-questions.test.mjs

      - name: The rule of a retry
        run: node albanna/public/js/side-chat/retry.test.mjs

      - name: The transcript window
        run: node albanna/public/js/side-chat/window.test.mjs

  server:
    name: Server tests
    runs-on: ubuntu-latest
    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Setup the bench
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app --branch version-15 frappe
          bench get-app --branch version-15 erpnext
          bench get-app $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app erpnext
          bench --site test_site install-app albanna
        env:
          CI: "Yes"

      - name: Give the site some data
        working-directory: /home/runner/frappe-bench
        # The site suite writes a document and reads it back, so the site
        # needs a company, a customer and an item.  ERPNext's own demo
        # setup is the honest way to get them: it uses the framework's
        # paths, so it cannot drift from the data the tests expect.
        run: |
          bench --site test_site execute erpnext.setup.demo.setup_demo_data
          bench --site test_site set-config allow_tests true
          bench build
        env:
          CI: "Yes"

      - name: Run the server tests
        working-directory: /home/runner/frappe-bench
        run: bench --site test_site run-tests --app albanna
        env:
          TYPE: server
